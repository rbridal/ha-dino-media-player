name: Brand PNGs

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/brand-pngs.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write brand PNGs
        run: |
          python3 << 'PY'
          import base64
          from pathlib import Path
          ICON = ""
          ICON2X = ""
          dests = [Path("custom_components/dino_media_player/brand"), Path("brand")]
          raw256 = base64.b64decode(ICON)
          raw512 = base64.b64decode(ICON2X)
          names256 = ["icon.png", "dark_icon.png", "logo.png", "dark_logo.png"]
          names512 = ["icon@2x.png", "dark_icon@2x.png", "logo@2x.png", "dark_logo@2x.png"]
          for dest in dests:
              dest.mkdir(parents=True, exist_ok=True)
              for name in names256:
                  (dest / name).write_bytes(raw256)
              for name in names512:
                  (dest / name).write_bytes(raw512)
              print("wrote", dest)
          PY
      - name: Commit PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/dino_media_player/brand brand
          if git diff --cached --quiet; then echo "No PNG changes"; else git commit -m "Add Home Assistant brand PNGs" && git push; fi
